<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6f3">
    <title>WiFi Tracker | Clients</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="container app-shell">
        <header class="page-header">
            <div class="page-heading">
                <h1>WiFi Tracker</h1>
                <p class="page-subtitle">Client payments and service status</p>
            </div>
            <div class="header-actions">
                <button onclick="sendTelegramAlert()" class="btn btn-accent" title="Send alert via Telegram immediately">Send alert</button>
                <button onclick="handleLogout()" class="btn btn-quiet">Log out</button>
            </div>
        </header>

        <section class="summary-row" aria-label="Client summary">
            <div class="summary-item">
                <span class="summary-label">Matching clients</span>
                <strong id="clientCount" class="summary-value">—</strong>
            </div>
            <div class="summary-item">
                <span class="summary-label">Overdue</span>
                <strong id="overdueCount" class="summary-value summary-overdue">—</strong>
            </div>
            <div class="summary-item">
                <span class="summary-label">Payment not set</span>
                <strong id="unpaidCount" class="summary-value">—</strong>
            </div>
        </section>

        <section class="toolbar" aria-label="Client controls">
            <div class="search-row">
                <div class="search-input-wrap">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20 20-4-4"/></svg>
                    <input type="search" id="searchInput" placeholder="Search room, area, SSID or MAC" aria-label="Search clients">
                    <button type="button" class="clear-search" onclick="clearSearch()" title="Clear search" aria-label="Clear search">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
                    </button>
                </div>
                <button onclick="handleSearch()" class="btn btn-primary search-submit">Search</button>
            </div>
            <div class="toolbar-actions">
                <div class="sort-control" aria-label="Sort by room">
                    <span class="sort-label">Room</span>
                    <button class="sort-btn" onclick="sortClients('asc')" aria-label="Sort rooms A to Z">A–Z</button>
                    <button class="sort-btn" onclick="sortClients('desc')" aria-label="Sort rooms Z to A">Z–A</button>
                </div>
                <button onclick="openModal('addModal')" class="btn btn-primary add-client-button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    Add client
                </button>
            </div>
        </section>

        <section class="table-container" aria-label="Client list">
            <div id="message" role="status" aria-live="polite"></div>
            <div class="table-heading">
                <h2>Clients</h2>
                <span id="resultCount" class="result-count"></span>
            </div>
            <div class="table-scroll">
            <table class="clients-table">
                <thead>
                    <tr>
                        <th>Room</th>
                        <th>Area</th>
                        <th>SSID</th>
                        <th>MAC Address</th>
                        <th>Due Day</th>
                        <th>Last Payment</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="clientsList"></tbody>
            </table>
            </div>
        </section>

        <!-- Add Modal -->
        <div id="addModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add Client</h2>
                    <button type="button" class="modal-close" onclick="closeModal('addModal')">&times;</button>
                </div>
                <form id="addForm" onsubmit="submitAddForm(event)">
                    <div class="form-group">
                        <label class="required">Room Number</label>
                        <input type="text" id="addRoom" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Area</label>
                        <input type="text" id="addArea" required>
                    </div>
                    <div class="form-group">
                        <label>SSID (Optional)</label>
                        <input type="text" id="addSsid">
                    </div>
                    <div class="form-group">
                        <label class="required">MAC Address</label>
                        <input type="text" id="addMac" placeholder="XX:XX:XX:XX:XX:XX or XX-XX-XX-XX-XX-XX" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Due Day (1-31)</label>
                        <input type="number" id="addDueDay" min="1" max="31" required>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn">Add Client</button>
                        <button type="button" onclick="closeModal('addModal')" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Edit Client</h2>
                    <button type="button" class="modal-close" onclick="closeModal('editModal')">&times;</button>
                </div>
                <form id="editForm" onsubmit="submitEditForm(event)">
                    <div class="form-group">
                        <label>MAC Address (Read-only)</label>
                        <input type="text" id="editMac" readonly>
                    </div>
                    <div class="form-group">
                        <label class="required">Room Number</label>
                        <input type="text" id="editRoom" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Area</label>
                        <input type="text" id="editArea" required>
                    </div>
                    <div class="form-group">
                        <label>SSID (Optional)</label>
                        <input type="text" id="editSsid">
                    </div>
                    <div class="form-group">
                        <label class="required">Due Day (1-31)</label>
                        <input type="number" id="editDueDay" min="1" max="31" required>
                    </div>
                    <div class="form-group">
                        <label>Last Payment Date</label>
                        <input type="date" id="editLastPayment">
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn">Update Client</button>
                        <button type="button" onclick="closeModal('editModal')" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Check authentication on page load
        window.addEventListener('load', () => {
            fetch('/admin/auth/check', { credentials: 'include' })
                .then(r => { if (!r.ok) window.location.href = '/admin/login'; else loadClients(); })
                .catch(() => window.location.href = '/admin/login');
        });

        function handleLogout() {
            fetch('/admin/logout', { method: 'POST', credentials: 'include' }).finally(() => window.location.href = '/admin/login');
        }

        async function sendTelegramAlert() {
            if (!confirm('Send payment alert via Telegram?')) return;
            
            try {
                const response = await fetch('/admin/send-alert', {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    await response.json();
                    showMessage('Alert sent successfully', 'success');
                } else {
                    const error = await response.json();
                    showMessage('Failed to send alert: ' + error.detail, 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error sending alert', 'danger');
            }
        }

        let currentClients = [];
        let currentSort = null;

        async function loadClients(search = null) {
            try {
                const url = new URL('/admin/clients', window.location.origin);
                if (search) url.searchParams.append('search', search);
                
                const response = await fetch(url, { credentials: 'include' });
                currentClients = await response.json();
                currentSort = null;
                updateSortButtons();
                renderClients(currentClients);
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error loading clients', 'danger');
            }
        }

        function renderClients(clients) {
            const tbody = document.getElementById('clientsList');
            tbody.innerHTML = '';
            updateSummary();
            document.getElementById('resultCount').textContent = `${currentClients.length} ${currentClients.length === 1 ? 'record' : 'records'}`;

            if (clients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No clients found</td></tr>';
                return;
            }

            clients.forEach(client => {
                const mac = escapeHtml(client.mac || '');
                let statusClass = 'active';
                const statusDisplay = client.status || 'Not set';
                
                if (statusDisplay.toLowerCase().includes('overdue')) {
                    statusClass = 'overdue';
                } else if (statusDisplay === 'Not set') {
                    statusClass = 'not-set';
                }
                
                const row = `
                    <tr>
                        <td data-label="Room">${escapeHtml(client.room_number)}</td>
                        <td data-label="Area">${escapeHtml(client.area)}</td>
                        <td data-label="SSID">${escapeHtml(client.ssid || '—')}</td>
                        <td data-label="MAC"><span class="mac-value">${mac || '—'}</span></td>
                        <td data-label="Due Day">${escapeHtml(client.due_day)}</td>
                        <td data-label="Last Payment">${escapeHtml(client.last_payment || '—')}</td>
                        <td data-label="Status"><span class="status ${statusClass}">${escapeHtml(statusDisplay)}</span></td>
                        <td data-label="Actions" class="actions">
                            <button type="button" data-action="edit" data-mac="${mac}" class="btn btn-quiet">Edit</button>
                            <button type="button" data-action="delete" data-mac="${mac}" class="btn btn-danger">Delete</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function updateSummary() {
            const overdue = currentClients.filter(client => (client.status || '').toLowerCase().includes('overdue')).length;
            const unpaid = currentClients.filter(client => client.status === 'Not set').length;
            document.getElementById('clientCount').textContent = currentClients.length;
            document.getElementById('overdueCount').textContent = overdue;
            document.getElementById('unpaidCount').textContent = unpaid;
        }

        function handleSearch() {
            const search = document.getElementById('searchInput').value.trim();
            loadClients(search || null);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            loadClients();
        }

        function sortClients(order) {
            currentSort = order;
            updateSortButtons();
            
            const sorted = [...currentClients];
            sorted.sort((a, b) => {
                const roomA = a.room_number.toLowerCase();
                const roomB = b.room_number.toLowerCase();
                
                if (order === 'asc') {
                    return roomA.localeCompare(roomB);
                } else {
                    return roomB.localeCompare(roomA);
                }
            });

            renderClients(sorted);
        }

        function updateSortButtons() {
            const buttons = document.querySelectorAll('.sort-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (currentSort === 'asc') {
                buttons[0].classList.add('active');
            } else if (currentSort === 'desc') {
                buttons[1].classList.add('active');
            }
        }

        async function deleteClient(mac) {
            if (!confirm('Delete this client?')) return;
            try {
                const response = await fetch(`/admin/clients/${mac}`, { method: 'DELETE', credentials: 'include' });
                if (response.ok) {
                    showMessage('Client deleted', 'success');
                    loadClients();
                } else {
                    showMessage('Failed to delete client', 'danger');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'danger');
            }
        }

        function showMessage(msg, type) {
            const div = document.getElementById('message');
            div.className = `alert alert-${type}`;
            div.classList.add('show');
            div.textContent = msg;
            clearTimeout(div.messageTimeout);
            div.messageTimeout = setTimeout(() => {
                div.textContent = '';
                div.className = 'alert';
            }, 5000);
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
            if (modalId === 'addModal') {
                document.getElementById('addForm').reset();
            }
        }

        function openEditModal(mac) {
            fetch(`/admin/clients/${mac}`, { credentials: 'include' })
                .then(r => r.json())
                .then(client => {
                    document.getElementById('editMac').value = client.mac;
                    document.getElementById('editRoom').value = client.room_number;
                    document.getElementById('editArea').value = client.area;
                    document.getElementById('editSsid').value = client.ssid || '';
                    document.getElementById('editDueDay').value = client.due_day;
                    document.getElementById('editLastPayment').value = client.last_payment || '';
                    openModal('editModal');
                })
                .catch(err => showMessage('Error loading client', 'danger'));
        }

        async function submitAddForm(e) {
            e.preventDefault();
            const ssidValue = document.getElementById('addSsid').value.trim();
            const data = {
                room_number: document.getElementById('addRoom').value.trim(),
                area: document.getElementById('addArea').value.trim(),
                ssid: ssidValue.length > 0 ? ssidValue : "",
                mac: document.getElementById('addMac').value.trim(),
                due_day: parseInt(document.getElementById('addDueDay').value)
            };
            try {
                const response = await fetch('/admin/clients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    showMessage('Client added successfully', 'success');
                    closeModal('addModal');
                    loadClients();
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Failed to add client', 'danger');
                }
            } catch (err) {
                showMessage('Error: ' + err.message, 'danger');
            }
        }

        async function submitEditForm(e) {
            e.preventDefault();
            const mac = document.getElementById('editMac').value;
            const ssidValue = document.getElementById('editSsid').value.trim();
            const paymentValue = document.getElementById('editLastPayment').value;
            const data = {
                room_number: document.getElementById('editRoom').value.trim(),
                area: document.getElementById('editArea').value.trim(),
                ssid: ssidValue.length > 0 ? ssidValue : "",
                due_day: parseInt(document.getElementById('editDueDay').value),
                last_payment: paymentValue.length > 0 ? paymentValue : null
            };
            try {
                const response = await fetch(`/admin/clients/${mac}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    showMessage('Client updated successfully', 'success');
                    closeModal('editModal');
                    loadClients();
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Failed to update client', 'danger');
                }
            } catch (err) {
                showMessage('Error: ' + err.message, 'danger');
            }
        }

        // Close modal when clicking outside
        document.addEventListener('click', (e) => {
            const actionButton = e.target.closest('[data-action][data-mac]');
            if (actionButton) {
                if (actionButton.dataset.action === 'edit') openEditModal(actionButton.dataset.mac);
                if (actionButton.dataset.action === 'delete') deleteClient(actionButton.dataset.mac);
            }

            const addModal = document.getElementById('addModal');
            const editModal = document.getElementById('editModal');
            if (e.target === addModal) closeModal('addModal');
            if (e.target === editModal) closeModal('editModal');
        });

        document.getElementById('searchInput').addEventListener('keydown', event => {
            if (event.key === 'Enter') handleSearch();
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeModal('addModal');
                closeModal('editModal');
            }
        });
    </script>

</body>
</html>
