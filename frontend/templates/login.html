<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6f3">
    <title>WiFi Tracker | Sign in</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="loginTitle">
            <div class="login-heading">
                <h1 id="loginTitle">WiFi Tracker</h1>
                <p class="page-subtitle">Sign in to manage client accounts</p>
            </div>
            
            <div id="message" class="alert" role="alert" aria-live="polite"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary login-btn" id="loginBtn">Sign in</button>
                <div class="loading" id="loading">Logging in...</div>
            </form>
        </section>
    </main>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            const message = document.getElementById('message');

            // Disable button and show loading
            loginBtn.disabled = true;
            loading.style.display = 'block';
            message.classList.remove('show');

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                loading.style.display = 'none';

                if (response.ok) {
                    // Login successful - redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 300);
                } else {
                    // Login failed
                    const error = await response.json();
                    message.textContent = error.detail || 'Invalid credentials';
                    message.classList.add('show');
                    message.classList.add('alert-danger');
                    loginBtn.disabled = false;
                }
            } catch (error) {
                loading.style.display = 'none';
                message.textContent = 'Error: ' + error.message;
                message.classList.add('show');
                message.classList.add('alert-danger');
                loginBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
